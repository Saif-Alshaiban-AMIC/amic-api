# 1. Database — Render internal DB (prod) / local fallback (dev)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/recruitment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# 4. Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 5. DDL Auto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 6. Server port (explicit for Render)
server.port=8080

# 7. HikariCP — don't fail on startup if DB is temporarily unavailable
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.keepalive-time=30000

# 8. Defer JPA init so Tomcat binds to port BEFORE DB connection is attempted
spring.jpa.defer-datasource-initialization=true
spring.main.lazy-initialization=true


