# 1. Use the "pooler" endpoint for better stability in Spring
spring.datasource.url=jdbc:postgresql://ep-weathered-bar-al71ove8-pooler.c-3.eu-central-1.aws.neon.tech:6543/neondb?sslmode=require

# 2. Username
spring.datasource.username=neondb_owner

# 3. Password
spring.datasource.password=${DB_PASSWORD:npg_AiE03PFvdNIz}

# 4. Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 5. DDL Auto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 6. Server port (explicit for Render)
server.port=8080

# 7. HikariCP — don't fail on startup if DB is temporarily unavailable
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.keepalive-time=30000

# 8. Defer JPA init so Tomcat binds to port BEFORE DB connection is attempted
spring.jpa.defer-datasource-initialization=true
spring.main.lazy-initialization=true


